name: Update EPEN

on:
  schedule:
    - cron: '*/10 * * * *' # Tiap 10 menit, biar token gak expired
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ambil & Filter Playlist
        run: |
          mkdir -p p
          python3 - << 'PYEOF'
          import requests, re
          from collections import Counter

          SOURCE_URL = "https://livetv.chairulamri1412.workers.dev"
          NAMA_KATEGORI_BARU = "LIVE EVENT"
          OUTPUT_FILE = "p/epen"

          print(f"Ngambil dari: {SOURCE_URL}")
          headers = {"User-Agent": "Mozilla/5.0"}
          r = requests.get(SOURCE_URL, headers=headers, timeout=30)
          r.raise_for_status()
          lines = r.text.splitlines()

          hasil = ["#EXTM3U"]
          total = 0

          # Buat nyimpen channel yang lagi diproses
          buffer_channel = []
          lagi_nyimpen = False
          semua_kategori = Counter()

          for raw_line in lines:
              line = raw_line.strip()
              if not line:
                  continue

              if line.startswith("#EXTINF"):
                  # Kalau buffer sebelumnya belum ke-save, buang
                  # (karena channel sebelumnya gak cocok filter)
                  buffer_channel = []
                  
                  m = re.search(r'group-title="([^"]*)"', line)
                  grup = m.group(1) if m else ""
                  semua_kategori[grup] += 1
                  grup_lower = grup.lower()

                  # FILTER: harus ada EVENT + VISION
                  if "event" in grup_lower and "vision+" in grup_lower:
                      # Ganti nama kategori, tapi JANGAN ubah sisanya
                      line_baru = re.sub(r'group-title="[^"]*"', f'group-title="{NAMA_KATEGORI_BARU}"', line)
                      if 'group-title=' not in line_baru:
                          line_baru = line_baru.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{NAMA_KATEGORI_BARU}"')
                      buffer_channel = [line_baru]
                      lagi_nyimpen = True
                  else:
                      lagi_nyimpen = False

              elif lagi_nyimpen:
                  # 👇 INI KUNCINYA: SEMUA BARIS DI SINI DIKOPI APA ADANYA
                  # Termasuk #EXTVLCOPT, #KODIPROP, #EXTGRP, dll
                  buffer_channel.append(line)

                  # Kalau baris ini adalah URL (bukan diawali #), berarti channel selesai
                  # Langsung masukin ke hasil
                  if not line.startswith("#"):
                      hasil.extend(buffer_channel)
                      buffer_channel = []
                      lagi_nyimpen = False
                      total += 1

          print("=== SEMUA KATEGORI ===")
          for k, v in semua_kategori.most_common():
              print(f"{v} | [{k}]")
          print(f"Dapet {total} channel EPEN")

          with open(OUTPUT_FILE, "w", encoding="utf-8") as f:
              f.write("\n".join(hasil))
          PYEOF

      - name: Commit & Push
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Playlist Bot"
          git add p/epen
          git diff --cached --quiet || git commit -m "Update EPEN - $(date +'%d-%m-%Y %H:%M')"
          git push
